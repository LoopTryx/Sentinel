<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel passwords</title><link rel="stylesheet" href="src/field-vault.css"></head><body><main><header><img src="src/assets/brand/sentinel-32.png" alt=""><div><strong>Sentinel</strong><small id="site">Passwords</small></div><button id="close" aria-label="Close password picker">×</button></header><p id="status" role="status">Checking your vault…</p><section id="choices"></section><button id="unlock" hidden>Unlock with Windows Hello</button><section id="generator" hidden><label>Length <output id="length-value">20</output><input id="length" type="range" min="12" max="48" value="20"></label><div class="groups"><label><input type="checkbox" data-group="lower" checked>a–z</label><label><input type="checkbox" data-group="upper" checked>A–Z</label><label><input type="checkbox" data-group="numbers" checked>0–9</label><label><input type="checkbox" data-group="symbols" checked>#!%</label></div><input id="password" readonly aria-label="Recommended password"><div class="actions"><button id="regenerate">Regenerate</button><button id="use">Use password</button></div></section><footer><button id="generate">Generate a password</button><span>Windows Hello protected</span></footer></main><script type="module" src="src/field-vault.js"></script></body></html>
