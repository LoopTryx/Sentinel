<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel · Email reader preview</title>
<style>
:root{color-scheme:dark;font:15px/1.6 "Segoe UI",system-ui;color:#eee9dc;background:#0d1127}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #afaea230;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:750;letter-spacing:.15em}.tag{font:11px ui-monospace,monospace;letter-spacing:.1em;color:#8ac7ff}main{max-width:760px;margin:40px auto;padding:0 24px}h1{font-size:28px;line-height:1.2;margin:12px 0}p{color:#c0bfb4;margin:12px 0 24px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}select,button{min-height:44px;border:1px solid #8ac7ff60;border-radius:8px;padding:10px 16px;background:#1b1e4a;color:#eee9dc;font:inherit}button{cursor:pointer;background:#214a78}:focus-visible{outline:3px solid #8ac7ff;outline-offset:4px}.panel{padding:24px;border:1px solid #2f89e360;border-radius:16px;background:linear-gradient(145deg,#20284c,#141832)}h2{margin:0 0 20px;font-size:17px}dl{margin:0}dl div{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid #afaea226}dt{color:#c0bfb4}dd{margin:0;text-align:right;overflow-wrap:anywhere}footer{margin:24px 0;color:#c0bfb4;font-size:12px}.status{color:#8ac7ff;font-size:13px}@media(max-width:480px){dl div{display:block}dd{text-align:left;margin-top:4px}header{padding:20px}.panel{padding:20px}}
</style></head><body><header><span class="brand">SENTINEL</span><span class="tag">STAGE 1 / LOCAL FIXTURES</span></header>
<main><span class="tag">EMAIL CHECKS</span><h1>Read the email. Keep it private.</h1><p>Reader preview using invented emails. Scam scoring and inbox access are not enabled.</p>
<div class="toolbar"><label for="provider">Provider</label><select id="provider"><option value="gmail">Gmail</option><option value="outlook">Outlook</option></select><button id="read" type="button">Read sample</button></div>
<section class="panel" aria-labelledby="heading"><h2 id="heading">Extracted fields</h2><dl id="fields"></dl><p class="status" id="status" role="status"></p></section><footer>No email stored · No attachment opened · No AI upload</footer></main>
<script type="module">
import {gmailAdapter} from '../../src/email/providers/gmail.js';import {outlookAdapter} from '../../src/email/providers/outlook.js';
const provider=document.getElementById('provider'),fields=document.getElementById('fields'),status=document.getElementById('status'),button=document.getElementById('read');
async function read(){button.disabled=true;fields.replaceChildren();try{const id=provider.value;const html=await(await fetch(`./${id}-open-email.html`)).text();const doc=new DOMParser().parseFromString(html,'text/html');const adapter=id==='gmail'?gmailAdapter:outlookAdapter;const snapshot=adapter.read(adapter.roots(doc)[0]);if(!snapshot)throw Error();const rows=[['Sender address',snapshot.sender.address?'Observed':'Unavailable'],['Subject',snapshot.subject?'Observed':'Unavailable'],['Body text',`${snapshot.body.length} characters`],['Reply-To',snapshot.replyTo?'Observed':'Unavailable'],['Links',`${snapshot.links.length} · label and actual destination`],['Attachments',`${snapshot.attachments.length} · names only`],['SPF / DKIM / DMARC',Object.values(snapshot.authentication).join(' / ')],['Scam verdict','Not implemented in stage 1']];for(const [label,value] of rows){const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);fields.append(row);}status.textContent='Synthetic extraction complete · partial coverage';}catch{status.textContent='Sample extraction unavailable.';}finally{button.disabled=false;}}
button.onclick=read;provider.onchange=read;void read();
</script></body></html>
